name: Continuous Deployment Pipeline
run-name: ${{ github.actor }}

on:
  workflow_run:
    workflows:
      - Continuous Integration Pipeline (Maven Build, Package, Docker)
    types:
      - completed
    branches:
      - test

jobs:
  cd-pipeline:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Start Deploying EC2..."
            cd /home/ubuntu
            
            if sudo grep -q "^IMAGE_TAG=" .env 2>/dev/null; then
              sudo sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.event.workflow_run.head_sha }}/" .env
            else
              sudo bash -c 'echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> .env'
            fi
            
            sudo docker compose pull backend-service
            sudo docker compose up -d --force-recreate backend-service
            sudo docker image prune -f
            echo "Deploy EC2 Successfully!"

      - name: Send CD success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Deploy thành công - ${{ github.repository }}"
          to: duongthichvo@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy lên EC2 thành công.
            Repo: ${{ github.repository }}
            Commit: ${{ github.event.workflow_run.head_sha }}
            Chi tiết: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send CD failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Deploy thất bại - ${{ github.repository }}"
          to: duongthichvo@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy lên EC2 bị lỗi.
            Repo: ${{ github.repository }}
            Commit: ${{ github.event.workflow_run.head_sha }}
            Xem log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}